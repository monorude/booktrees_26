<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>蔵書管理</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">蔵書管理</h1>
      <!-- ログイン中のメールアドレス。app.js が /api/me の結果を入れる -->
      <p class="header__user" id="current-user">読み込み中…</p>
    </header>

    <main class="main">
      <!-- 一般書籍と同人誌はタブで切り替える（仕様: 別タブで表示） -->
      <nav class="tabs" id="tabs">
        <button class="tab is-active" type="button" data-type="general">
          一般書籍
        </button>
        <button class="tab" type="button" data-type="doujin">同人誌</button>
      </nav>

      <!-- 書籍一覧。中身は app.js が組み立てる -->
      <ul class="book-list" id="book-list"></ul>

      <!-- 0 件のときやエラーのときに出すメッセージ -->
      <p class="notice" id="notice"></p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
